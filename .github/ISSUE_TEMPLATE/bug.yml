name: 回報問題
description: 網頁壞掉或顯示不正常
title: "[問題] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 發生什麼事
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 怎麼重現
      description: 照著做就能看到問題的步驟
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 本來應該要怎樣
  - type: input
    id: env
    attributes:
      label: 瀏覽器與系統
      placeholder: Chrome / Windows 11
  - type: textarea
    id: screenshot
    attributes:
      label: 截圖
      description: 可以直接把圖片拖進來
